[project]
name = "django_form_faker"
version = "0.1.0"
description = "Django Form Faker creates test data for Django Forms."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kevin Carrogan" }]
requires-python = ">=3.8"
dependencies = [
    "Django>=3.2",
    "Faker~=11.3.0",
]

[dependency-groups]
dev = [
    "black",
    "freezegun",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-django",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["django_form_faker"]
exclude = ["django_form_faker/tests"]

[tool.pytest.ini_options]
addopts = "--cov=django_form_faker"

[tool.coverage.run]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
